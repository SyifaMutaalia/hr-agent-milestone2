[project]
name = "hr-agent"
version = "0.1.0"
description = "HR Policy and Leave AI Agent"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.33.0",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "pinecone>=8.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "pandas>=3.0.6",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: requires a running API and live OpenAI credentials"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.vercel]
entrypoint = "src.api:app"